version: '3.8'

services:
  dubbing-engine:
    build: .
    container_name: video-dubbing-engine
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=auto
    volumes:
      - ./storage:/workspace/storage
    restart: unless-stopped